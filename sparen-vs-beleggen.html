<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparen vs Beleggen Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #1a1a1a;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 640px) {
      .stat-cards { grid-template-columns: repeat(2, 1fr); }
      .controls { grid-template-columns: 1fr !important; }
    }

    .stat-card {
      background: #ebebea;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .stat-sub {
      font-size: 12px;
      color: #666;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 2rem;
      margin-bottom: 1rem;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-label {
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      min-width: 130px;
    }

    .ctrl-val {
      font-size: 14px;
      font-weight: 500;
      min-width: 52px;
      text-align: right;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #444;
      height: 4px;
      cursor: pointer;
    }

    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #666;
      align-items: center;
      flex-wrap: wrap;
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .leg-line {
      width: 24px;
      height: 3px;
      border-radius: 2px;
    }

    .leg-dash {
      width: 24px;
      border-top: 2px dashed #999;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 320px;
      background: #fff;
      border-radius: 8px;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sparen vs Beleggen Calculator</h1>

    <div class="stat-cards">
      <div class="stat-card">
        <p class="stat-label">Inleg</p>
        <p class="stat-value" id="stat-inleg" style="color: #1a1a1a;">€10.000</p>
        <p class="stat-sub">startkapitaal</p>
      </div>
      <div class="stat-card">
        <p class="stat-label" id="label-sparen">Sparen 2,0% — na 30 jaar</p>
        <p class="stat-value" id="stat-sparen" style="color: #2383c4;">€18.114</p>
        <p class="stat-sub" id="stat-sparen-winst">+€8.114 winst</p>
      </div>
      <div class="stat-card">
        <p class="stat-label" id="label-beleggen">Beleggen 6,0% — na 30 jaar</p>
        <p class="stat-value" id="stat-beleggen" style="color: #1d9e75;">€57.435</p>
        <p class="stat-sub" id="stat-beleggen-winst">+€47.435 winst</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Verschil</p>
        <p class="stat-value" id="stat-verschil" style="color: #c0392b;">€39.321</p>
        <p class="stat-sub">meer door te beleggen</p>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <label class="ctrl-label" for="slider-start">Startbedrag</label>
        <input type="range" id="slider-start" min="1000" max="100000" step="1000" value="10000" />
        <span class="ctrl-val" id="val-start">€10.000</span>
      </div>
      <div class="ctrl-group">
        <label class="ctrl-label" for="slider-monthly">Maandelijkse storting</label>
        <input type="range" id="slider-monthly" min="0" max="2000" step="50" value="0" />
        <span class="ctrl-val" id="val-monthly">€0</span>
      </div>
      <div class="ctrl-group">
        <label class="ctrl-label" for="slider-rsparen" style="color: #2383c4;">Spaarrente</label>
        <input type="range" id="slider-rsparen" min="0" max="10" step="0.1" value="2" />
        <span class="ctrl-val" id="val-rsparen">2,0%</span>
      </div>
      <div class="ctrl-group">
        <label class="ctrl-label" for="slider-rbeleggen" style="color: #1d9e75;">Beleggingsrendement</label>
        <input type="range" id="slider-rbeleggen" min="0" max="15" step="0.1" value="6" />
        <span class="ctrl-val" id="val-rbeleggen">6,0%</span>
      </div>
      <div class="ctrl-group" style="grid-column: 1 / -1;">
        <label class="ctrl-label" for="slider-years">Looptijd</label>
        <input type="range" id="slider-years" min="1" max="50" step="1" value="30" />
        <span class="ctrl-val" id="val-years">30 jaar</span>
      </div>
    </div>

    <div class="legend">
      <div class="leg-item">
        <div class="leg-line" style="background: #2383c4;"></div>
        <span id="leg-sparen">Spaarrekening 2,0%</span>
      </div>
      <div class="leg-item">
        <div class="leg-line" style="background: #1d9e75;"></div>
        <span id="leg-beleggen">Beleggen 6,0%</span>
      </div>
      <div class="leg-item">
        <div class="leg-dash"></div>
        <span>Inleg (nominaal)</span>
      </div>
    </div>

    <div class="chart-wrapper">
      <canvas id="growthChart" role="img" aria-label="Lijndiagram dat groei van sparen en beleggen vergelijkt."></canvas>
    </div>
  </div>

  <script>
    function fmt(n) {
      return '€' + Math.round(n).toLocaleString('nl-NL');
    }

    function fmtPct(v) {
      return v.toFixed(1).replace('.', ',') + '%';
    }

    function calcSeries(start, monthly, rate, years) {
      const pts = [];
      let v = start;
      for (let y = 0; y <= years; y++) {
        pts.push(Math.round(v));
        for (let m = 0; m < 12; m++) v = v * (1 + rate / 12) + monthly;
      }
      return pts;
    }

    function calcInleg(start, monthly, years) {
      return Array.from({ length: years + 1 }, (_, y) => Math.round(start + monthly * 12 * y));
    }

    function makeLabels(years) {
      const step = years <= 20 ? 5 : 10;
      return Array.from({ length: years + 1 }, (_, i) => {
        if (i === 0) return 'Start';
        if (i === years) return 'Jaar ' + i;
        return i % step === 0 ? 'Jaar ' + i : '';
      });
    }

    let chart;

    function buildChart() {
      const start = parseInt(document.getElementById('slider-start').value);
      const monthly = parseInt(document.getElementById('slider-monthly').value);
      const rSparen = parseFloat(document.getElementById('slider-rsparen').value) / 100;
      const rBeleggen = parseFloat(document.getElementById('slider-rbeleggen').value) / 100;
      const years = parseInt(document.getElementById('slider-years').value);

      const sp = calcSeries(start, monthly, rSparen, years);
      const bel = calcSeries(start, monthly, rBeleggen, years);
      const inleg = calcInleg(start, monthly, years);
      const totalInleg = inleg[years];

      const spPct = fmtPct(rSparen * 100);
      const belPct = fmtPct(rBeleggen * 100);

      document.getElementById('label-sparen').textContent = 'Sparen ' + spPct + ' — na ' + years + ' jaar';
      document.getElementById('label-beleggen').textContent = 'Beleggen ' + belPct + ' — na ' + years + ' jaar';
      document.getElementById('leg-sparen').textContent = 'Spaarrekening ' + spPct;
      document.getElementById('leg-beleggen').textContent = 'Beleggen ' + belPct;

      document.getElementById('stat-inleg').textContent = fmt(totalInleg);
      document.getElementById('stat-sparen').textContent = fmt(sp[years]);
      document.getElementById('stat-sparen-winst').textContent = '+' + fmt(sp[years] - totalInleg) + ' winst';
      document.getElementById('stat-beleggen').textContent = fmt(bel[years]);
      document.getElementById('stat-beleggen-winst').textContent = '+' + fmt(bel[years] - totalInleg) + ' winst';

      const verschil = bel[years] - sp[years];
      document.getElementById('stat-verschil').textContent = (verschil >= 0 ? '' : '-') + fmt(Math.abs(verschil));
      document.getElementById('stat-verschil').style.color = verschil >= 0 ? '#c0392b' : '#2383c4';

      const newLabels = makeLabels(years);

      if (chart) {
        chart.data.labels = newLabels;
        chart.data.datasets[0].data = sp;
        chart.data.datasets[1].data = bel;
        chart.data.datasets[2].data = inleg;
        chart.update('none');
      } else {
        chart = new Chart(document.getElementById('growthChart'), {
          type: 'line',
          data: {
            labels: newLabels,
            datasets: [
              { label: 'Sparen', data: sp, borderColor: '#2383c4', borderWidth: 2.5, pointRadius: 0, tension: 0.35, fill: false },
              { label: 'Beleggen', data: bel, borderColor: '#1d9e75', borderWidth: 2.5, pointRadius: 0, tension: 0.35, fill: false },
              { label: 'Inleg', data: inleg, borderColor: 'rgba(0,0,0,0.25)', borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, fill: false }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: ctx => ' ' + fmt(ctx.parsed.y) } }
            },
            scales: {
              x: {
                grid: { color: 'rgba(0,0,0,0.07)' },
                ticks: { color: '#888', font: { size: 12 }, maxRotation: 0 }
              },
              y: {
                grid: { color: 'rgba(0,0,0,0.07)' },
                ticks: {
                  color: '#888',
                  font: { size: 12 },
                  callback: v => v >= 1000 ? '€' + Math.round(v / 1000) + 'k' : '€' + v
                }
              }
            }
          }
        });
      }
    }

    const sliderMap = {
      'slider-start': v => { document.getElementById('val-start').textContent = fmt(v); },
      'slider-monthly': v => { document.getElementById('val-monthly').textContent = fmt(v); },
      'slider-rsparen': v => { document.getElementById('val-rsparen').textContent = fmtPct(v); },
      'slider-rbeleggen': v => { document.getElementById('val-rbeleggen').textContent = fmtPct(v); },
      'slider-years': v => { document.getElementById('val-years').textContent = Math.round(v) + ' jaar'; }
    };

    Object.keys(sliderMap).forEach(id => {
      document.getElementById(id).addEventListener('input', function () {
        sliderMap[id](parseFloat(this.value));
        buildChart();
      });
    });

    buildChart();
  </script>
</body>
</html>
